apiVersion: apps/v1
kind: Deployment
metadata:
  name: opstrack-frontend
  namespace: opstrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opstrack-frontend
  template:
    metadata:
      labels:
        app: opstrack-frontend
    spec:
      containers:
        - name: frontend
          image: opstrack-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: nginx-config
          configMap:
            name: opstrack-frontend-nginx
