apiVersion: v1
kind: Service
metadata:
  name: {{ include "opstrack.fullname" . }}-backend
  labels:
    {{- include "opstrack.labels" . | nindent 4 }}
    app: opstrack-backend
spec:
  type: ClusterIP
  selector:
    app: opstrack-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
