apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opstrack.fullname" . }}-db
  labels:
    {{- include "opstrack.labels" . | nindent 4 }}
    app: opstrack-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opstrack-db
  template:
    metadata:
      labels:
        app: opstrack-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "opstrack.fullname" . }}-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opstrack.fullname" . }}-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "opstrack.fullname" . }}-db-secret
                  key: POSTGRES_DB
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
